name: CI AdonisJS

on:
  pull_request:
    paths:
      - packages/frontendmu-adonis/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/ci-adonis.yml
      - .github/workflows/deploy-adonis.yml
  push:
    branches: [main]
    paths:
      - packages/frontendmu-adonis/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/ci-adonis.yml
      - .github/workflows/deploy-adonis.yml

concurrency:
  group: ci-adonis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontendmu-adonis
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter frontendmu-adonis
        working-directory: .

      # Route and index types live in .adonisjs/, which the dev server writes on
      # boot. A fresh checkout has to generate them before typecheck and build.
      - name: Generate types
        run: NODE_ENV=test pnpm codegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/frontendmu-adonis/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
